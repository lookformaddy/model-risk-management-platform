[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-risk-management-platform"
version = "1.0.0"
description = "Model risk management (SR 11-7-style) platform: versioned model inventory with reproducibility manifests, rule-based risk tiering, tier-driven validation suites, champion/challenger comparison with a per-slice regression rule, signed staged approvals, drift/performance monitoring with a revalidation calendar, and a SHA-256 hash-chained audit log — all from scratch on seeded synthetic data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["mrmp"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
